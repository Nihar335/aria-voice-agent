<svg viewBox="0 0 1300 935" width="1300" height="935" xmlns="http://www.w3.org/2000/svg">
<title>Aria system architecture</title>
<style>
:root {
  --bg: #f3f6f9;
  --surface: #ffffff;
  --sunk: #e9eef4;
  --ink: #14202f;
  --muted: #566476;
  --line: #c9d2dd;
  --call: #0b7a83;      /* customer call path */
  --call-soft: #dcf0f1;
  --staff: #6a4fb8;     /* staff / admin path */
  --staff-soft: #ece7fa;
  --store: #7a8595;     /* storage writes */
  --warn: #a86400;
  --warn-soft: #f8ecd9;
  --ok: #2f7d47;
  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root {
    --bg: #0e141c; --surface: #161f2b; --sunk: #1c2734; --ink: #e5ebf2; --muted: #98a6b8; --line: #2e3a4a;
    --call: #4dbcc5; --call-soft: #12333a; --staff: #a68ff0; --staff-soft: #2a2343; --store: #8e9aab;
    --warn: #e2a64a; --warn-soft: #3a2c16; --ok: #6cc28a; color-scheme: dark;
} }
.bx { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.bx-call { fill: var(--call-soft); stroke: var(--call); stroke-width: 1.2; }
.bx-staff { fill: var(--staff-soft); stroke: var(--staff); stroke-width: 1.2; }
.bx-sunk { fill: var(--sunk); stroke: var(--line); stroke-width: 1.2; }
.frame { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 5; }
.t-h { font-family: var(--f-display); font-weight: 600; font-size: 13.5px; fill: var(--ink); }
.t-m { font-family: var(--f-mono); font-size: 10.5px; fill: var(--call); }
.t-ms { font-family: var(--f-mono); font-size: 10.5px; fill: var(--staff); }
.t-b { font-family: var(--f-body); font-size: 11.5px; fill: var(--muted); }
.t-lab { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.08em; fill: var(--muted); }
.t-step { font-family: var(--f-body); font-weight: 600; font-size: 12px; fill: var(--ink); }
.t-n { font-family: var(--f-mono); font-size: 10px; font-weight: 500; fill: var(--surface); }
.dot { fill: var(--call); }
.w-call { stroke: var(--call); stroke-width: 1.8; fill: none; }
.w-staff { stroke: var(--staff); stroke-width: 1.8; fill: none; }
.w-store { stroke: var(--store); stroke-width: 1.4; fill: none; stroke-dasharray: 4 4; }
.w-net { stroke: var(--warn); stroke-width: 2.2; fill: none; }
.w-net-thin { stroke: var(--warn); stroke-width: 1.6; fill: none; }
.mk-call { fill: var(--call); } .mk-staff { fill: var(--staff); } .mk-store { fill: var(--store); } .mk-net { fill: var(--warn); }
.rowline { stroke: var(--line); stroke-width: 1; }
.bg { fill: var(--bg); }
</style>
<rect class="bg" x="0" y="0" width="1300" height="935"/>
    <defs>
      <marker id="a-call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk-call"/></marker>
      <marker id="a-staff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk-staff"/></marker>
      <marker id="a-store" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk-store"/></marker>
      <marker id="a-net" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk-net"/></marker>
    </defs>

    <!-- column labels -->
    <text x="20" y="74" class="t-lab">CLIENTS · BROWSER</text>
    <rect x="240" y="50" width="760" height="705" rx="14" class="frame"/>
    <text x="258" y="74" class="t-lab">PYTHON BACKEND · FastAPI on uvicorn · main.py</text>
    <text x="1030" y="74" class="t-lab">CLOUD APIs</text>
    <text x="20" y="845" class="t-lab">STORAGE</text>
    <text x="20" y="862" class="t-b">local disk · data/</text>

    <!-- ===== Clients ===== -->
    <rect x="20" y="100" width="195" height="160" rx="8" class="bx-call"/>
    <text x="34" y="124" class="t-h">Customer page</text>
    <text x="34" y="141" class="t-m">index.html#customer</text>
    <text x="34" y="164" class="t-b">call-core.js: mic → 16 kHz WAV,</text>
    <text x="34" y="180" class="t-b">barge-in, language menu</text>
    <text x="34" y="200" class="t-b">customer.js: live chat summary</text>
    <text x="34" y="220" class="t-b">plays the reply audio;</text>
    <text x="34" y="236" class="t-b">browser voice if TTS fails</text>

    <rect x="20" y="280" width="195" height="220" rx="8" class="bx-staff"/>
    <text x="34" y="304" class="t-h">Admin page</text>
    <text x="34" y="321" class="t-ms">index.html#admin</text>
    <text x="34" y="344" class="t-b">Google sign-in or password</text>
    <text x="34" y="366" class="t-b">cockpit.js: live lead score,</text>
    <text x="34" y="382" class="t-b">BANT, agent reasoning, latency</text>
    <text x="34" y="398" class="t-b">(polls /api/call/{id}/live)</text>
    <text x="34" y="420" class="t-b">admin.js: knowledge upload,</text>
    <text x="34" y="436" class="t-b">sales dashboard, quality,</text>
    <text x="34" y="452" class="t-b">traces, audit log, users</text>

    <rect x="20" y="520" width="195" height="70" rx="8" class="bx-call"/>
    <text x="34" y="544" class="t-h">My calls page</text>
    <text x="34" y="561" class="t-m">my-calls.html#&lt;secret&gt;</text>
    <text x="34" y="578" class="t-b">the customer's own calls only</text>

    <rect x="20" y="610" width="195" height="110" rx="8" class="bx-staff"/>
    <text x="34" y="634" class="t-h">MCP clients</text>
    <text x="34" y="651" class="t-ms">Claude Desktop, CRM agents</text>
    <text x="34" y="674" class="t-b">"who are my hot leads?"</text>
    <text x="34" y="690" class="t-b">stdio transport,</text>
    <text x="34" y="706" class="t-b">role set by MCP_ROLE</text>

    <!-- ===== API column ===== -->
    <rect x="258" y="100" width="182" height="160" rx="8" class="bx"/>
    <text x="272" y="124" class="t-h">Call API</text>
    <text x="272" y="146" class="t-m">POST /api/call/start</text>
    <text x="272" y="162" class="t-m">POST /api/call/stt</text>
    <text x="272" y="178" class="t-m">POST /api/call/turn</text>
    <text x="272" y="194" class="t-m">GET  /api/call/{id}/live</text>
    <text x="272" y="210" class="t-m">POST /api/call/end</text>
    <text x="272" y="234" class="t-b">runs as the customer role:</text>
    <text x="272" y="250" class="t-b">5 call tools, own lead only</text>

    <rect x="258" y="280" width="182" height="100" rx="8" class="bx"/>
    <text x="272" y="304" class="t-h">Staff sign-in</text>
    <text x="272" y="321" class="t-ms">layers/rbac.py</text>
    <text x="272" y="342" class="t-b">Google OAuth 2.0 + PKCE</text>
    <text x="272" y="358" class="t-b">break-glass password</text>
    <text x="272" y="374" class="t-b">→ bearer token + role</text>

    <rect x="258" y="395" width="182" height="105" rx="8" class="bx"/>
    <text x="272" y="419" class="t-h">Admin API</text>
    <text x="272" y="436" class="t-ms">admin.py · /api/admin/*</text>
    <text x="272" y="457" class="t-b">documents, search, quality,</text>
    <text x="272" y="473" class="t-b">traces, audit, users</text>
    <text x="272" y="489" class="t-b">require(permission) per route</text>

    <rect x="258" y="520" width="182" height="70" rx="8" class="bx"/>
    <text x="272" y="544" class="t-h">Portal API</text>
    <text x="272" y="561" class="t-m">portal.py · /api/portal</text>
    <text x="272" y="578" class="t-b">secret link → own data only</text>

    <rect x="258" y="610" width="182" height="110" rx="8" class="bx"/>
    <text x="272" y="634" class="t-h">MCP server</text>
    <text x="272" y="651" class="t-ms">mcp_server.py</text>
    <text x="272" y="674" class="t-b">separate stdio process</text>
    <text x="272" y="690" class="t-b">same tools.py registry</text>
    <text x="272" y="706" class="t-b">every call in the audit log</text>

    <!-- ===== Agent + pipeline ===== -->
    <rect x="465" y="100" width="300" height="440" rx="8" class="bx"/>
    <text x="481" y="124" class="t-h">Agent</text>
    <text x="530" y="124" class="t-m">agent.py</text>
    <text x="481" y="143" class="t-b">call sessions and caller memory</text>
    <line x1="481" y1="158" x2="749" y2="158" class="rowline"/>
    <text x="481" y="178" class="t-lab">EVERY TURN · layers/pipeline.py</text>

    <g>
      <circle cx="492" cy="207" r="10" class="dot"/><text x="492" y="210.5" text-anchor="middle" class="t-n">1</text>
      <text x="510" y="204" class="t-step">Input guardrails</text>
      <text x="510" y="219" class="t-b">mask card, Aadhaar, PAN, OTP · injection</text>
      <circle cx="492" cy="249" r="10" class="dot"/><text x="492" y="252.5" text-anchor="middle" class="t-n">2</text>
      <text x="510" y="246" class="t-step">RAG retrieval</text>
      <text x="510" y="261" class="t-b">top facts + sources, no-guess threshold</text>
      <circle cx="492" cy="291" r="10" class="dot"/><text x="492" y="294.5" text-anchor="middle" class="t-n">3</text>
      <text x="510" y="288" class="t-step">Router</text>
      <text x="510" y="303" class="t-b">FAQ → fast model · booking → strong</text>
      <circle cx="492" cy="333" r="10" class="dot"/><text x="492" y="336.5" text-anchor="middle" class="t-n">4</text>
      <text x="510" y="330" class="t-step">Answer cache</text>
      <text x="510" y="345" class="t-b">repeated FAQ → reply with 0 LLM calls</text>
      <circle cx="492" cy="375" r="10" class="dot"/><text x="492" y="378.5" text-anchor="middle" class="t-n">5</text>
      <text x="510" y="372" class="t-step">System prompt</text>
      <text x="510" y="387" class="t-b">versioned file, hash in every trace</text>
      <circle cx="492" cy="417" r="10" class="dot"/><text x="492" y="420.5" text-anchor="middle" class="t-n">6</text>
      <text x="510" y="414" class="t-step">LLM ⇄ tools</text>
      <text x="510" y="429" class="t-b">think → act → observe, max 3 tool steps</text>
      <circle cx="492" cy="459" r="10" class="dot"/><text x="492" y="462.5" text-anchor="middle" class="t-n">7</text>
      <text x="510" y="456" class="t-step">Output guardrails</text>
      <text x="510" y="471" class="t-b">invented price or fake booking → redo</text>
      <circle cx="492" cy="501" r="10" class="dot"/><text x="492" y="504.5" text-anchor="middle" class="t-n">8</text>
      <text x="510" y="498" class="t-step">Trace</text>
      <text x="510" y="513" class="t-b">time, tokens, cost → observability.db</text>
    </g>

    <!-- Analysis -->
    <rect x="465" y="560" width="300" height="175" rx="8" class="bx"/>
    <text x="481" y="584" class="t-h">Call analysis</text>
    <text x="590" y="584" class="t-m">analysis.py</text>
    <text x="481" y="606" class="t-b">background task, after the reply is sent</text>
    <text x="481" y="628" class="t-b">language detection · sentiment · upset alert</text>
    <text x="481" y="646" class="t-b">BANT lead score 0-100 (a formula, not a guess)</text>
    <text x="481" y="664" class="t-b">end-of-call summary, objections, next steps</text>
    <text x="481" y="682" class="t-b">customer-safe summary for the portal</text>
    <text x="481" y="706" class="t-b">writes the lead record in crm.db</text>

    <!-- ===== Right core column ===== -->
    <rect x="785" y="100" width="195" height="75" rx="8" class="bx"/>
    <text x="799" y="123" class="t-h">Speech-to-text</text>
    <text x="910" y="123" class="t-m">stt.py</text>
    <text x="799" y="143" class="t-b">Whisper for English, Hindi</text>
    <text x="799" y="159" class="t-b">Gemini for Telugu, Kannada</text>

    <rect x="785" y="185" width="195" height="75" rx="8" class="bx"/>
    <text x="799" y="208" class="t-h">Text-to-speech</text>
    <text x="910" y="208" class="t-m">tts.py</text>
    <text x="799" y="228" class="t-b">Gemini natural voice (Telugu)</text>
    <text x="799" y="244" class="t-b">edge-tts for the others</text>

    <rect x="785" y="270" width="195" height="95" rx="8" class="bx"/>
    <text x="799" y="293" class="t-h">Knowledge search</text>
    <text x="928" y="293" class="t-m">rag.py</text>
    <text x="799" y="313" class="t-b">Gemini embeddings, cosine</text>
    <text x="799" y="329" class="t-b">TF-IDF keyword fallback</text>
    <text x="799" y="345" class="t-b">public + internal indexes</text>

    <rect x="785" y="375" width="195" height="60" rx="8" class="bx"/>
    <text x="799" y="398" class="t-h">Answer cache</text>
    <text x="799" y="416" class="t-m">layers/cache.py · memory</text>

    <rect x="785" y="445" width="195" height="110" rx="8" class="bx"/>
    <text x="799" y="468" class="t-h">LLM gateway</text>
    <text x="900" y="468" class="t-m">llm.py</text>
    <text x="799" y="490" class="t-b">fast and strong model tiers</text>
    <text x="799" y="506" class="t-b">Groq ⇄ Gemini fallback chain</text>
    <text x="799" y="522" class="t-b">JSON mode, skips a model</text>
    <text x="799" y="538" class="t-b">on rate limit</text>

    <rect x="785" y="575" width="195" height="160" rx="8" class="bx"/>
    <text x="799" y="598" class="t-h">Tool registry</text>
    <text x="900" y="598" class="t-m">tools.py</text>
    <text x="799" y="618" class="t-b">schema check + RBAC check</text>
    <text x="799" y="640" class="t-b">Customer (5): search, save lead,</text>
    <text x="799" y="656" class="t-b">check slots, book demo, handoff</text>
    <text x="799" y="678" class="t-b">Staff (+3): get lead, hot leads,</text>
    <text x="799" y="694" class="t-b">internal search</text>
    <text x="799" y="716" class="t-b">booking → Google Calendar link</text>

    <!-- ===== Cloud APIs ===== -->
    <rect x="1030" y="100" width="250" height="120" rx="8" class="bx-sunk"/>
    <text x="1044" y="124" class="t-h">Groq</text>
    <text x="1044" y="146" class="t-b">LLM: Qwen 3.8, GPT-OSS 120B / 20B</text>
    <text x="1044" y="162" class="t-b">STT: Whisper large-v3</text>
    <text x="1044" y="184" class="t-b">primary provider</text>
    <text x="1044" y="206" class="t-m">used by llm.py, stt.py</text>

    <rect x="1030" y="235" width="250" height="150" rx="8" class="bx-sunk"/>
    <text x="1044" y="259" class="t-h">Google Gemini</text>
    <text x="1044" y="281" class="t-b">LLM backup chain</text>
    <text x="1044" y="297" class="t-b">embeddings for RAG and the cache</text>
    <text x="1044" y="313" class="t-b">audio STT: Telugu, Kannada, Hinglish</text>
    <text x="1044" y="329" class="t-b">natural Telugu voice (TTS)</text>
    <text x="1044" y="351" class="t-m">used by llm, rag, stt, tts</text>

    <rect x="1030" y="400" width="250" height="85" rx="8" class="bx-sunk"/>
    <text x="1044" y="424" class="t-h">Edge neural voices</text>
    <text x="1044" y="446" class="t-b">English, Hindi, Kannada, Telugu</text>
    <text x="1044" y="470" class="t-m">used by tts.py (edge-tts)</text>

    <rect x="1030" y="500" width="250" height="85" rx="8" class="bx-sunk"/>
    <text x="1044" y="524" class="t-h">Google sign-in</text>
    <text x="1044" y="546" class="t-b">OAuth 2.0 proves the staff email</text>
    <text x="1044" y="570" class="t-m">used by layers/rbac.py</text>

    <!-- ===== Storage ===== -->
    <rect x="258" y="805" width="170" height="110" rx="8" class="bx-sunk"/>
    <text x="272" y="829" class="t-h">CRM database</text>
    <text x="272" y="846" class="t-m">data/crm.db · SQLite</text>
    <text x="272" y="867" class="t-b">leads · calls · appointments</text>
    <text x="272" y="883" class="t-b">portal tokens</text>
    <text x="272" y="903" class="t-b">adapter → Fortivex CRM</text>

    <rect x="442" y="805" width="170" height="110" rx="8" class="bx-sunk"/>
    <text x="456" y="829" class="t-h">Traces + audit</text>
    <text x="456" y="846" class="t-m">data/observability.db</text>
    <text x="456" y="867" class="t-b">one trace per turn</text>
    <text x="456" y="883" class="t-b">append-only audit log</text>
    <text x="456" y="899" class="t-b">staff users and roles</text>

    <rect x="626" y="805" width="170" height="110" rx="8" class="bx-sunk"/>
    <text x="640" y="829" class="t-h">Public knowledge</text>
    <text x="640" y="846" class="t-m">knowledge_base/</text>
    <text x="640" y="867" class="t-b">services, pricing, FAQ,</text>
    <text x="640" y="883" class="t-b">objection answers</text>
    <text x="640" y="899" class="t-b">the agent may say this</text>

    <rect x="810" y="805" width="170" height="110" rx="8" class="bx-sunk"/>
    <text x="824" y="829" class="t-h">Internal knowledge</text>
    <text x="824" y="846" class="t-ms">knowledge_internal/</text>
    <text x="824" y="867" class="t-b">confidential, git-ignored</text>
    <text x="824" y="883" class="t-b">admin search only, never</text>
    <text x="824" y="899" class="t-b">in the agent's prompt</text>

    <!-- ===== Wires: customer path ===== -->
    <path d="M215 165 H256" class="w-call" marker-end="url(#a-call)"/>
    <path d="M258 195 H217" class="w-call" marker-end="url(#a-call)"/>
    <path d="M440 180 H463" class="w-call" marker-start="url(#a-call)" marker-end="url(#a-call)"/>
    <path d="M420 100 V88 H775 V222 H783" class="w-call" marker-end="url(#a-call)"/>
    <path d="M775 137 H783" class="w-call" marker-end="url(#a-call)"/>
    <text x="690" y="84" text-anchor="middle" class="t-m">voice in · voice out</text>
    <path d="M215 555 H256" class="w-call" marker-end="url(#a-call)"/>

    <!-- pipeline to right column -->
    <path d="M765 300 H783" class="w-call" marker-end="url(#a-call)"/>
    <path d="M765 405 H783" class="w-call" marker-end="url(#a-call)"/>
    <path d="M765 480 H783" class="w-call" marker-end="url(#a-call)"/>
    <path d="M882 557 V573" class="w-call" marker-start="url(#a-call)" marker-end="url(#a-call)"/>

    <!-- ===== Wires: staff path ===== -->
    <path d="M215 330 H256" class="w-staff" marker-end="url(#a-staff)"/>
    <path d="M215 447 H256" class="w-staff" marker-end="url(#a-staff)"/>
    <path d="M215 665 H256" class="w-staff" marker-end="url(#a-staff)"/>

    <!-- ===== Wires: storage ===== -->
    <path d="M882 735 V770 H343 V803" class="w-store" marker-end="url(#a-store)"/>
    <path d="M615 735 V770" class="w-store"/>
    <path d="M465 505 H452 V785 H527 V803" class="w-store" marker-end="url(#a-store)"/>
    <path d="M711 805 V790 H992 V340 H982" class="w-store" marker-end="url(#a-store)"/>
    <text x="996" y="660" class="t-b" transform="rotate(-90 996 660)">builds the index</text>

    <!-- ===== Wires: HTTPS egress rail ===== -->
    <path d="M1005 137 V542" class="w-net"/>
    <path d="M980 137 H1005 M980 222 H1005 M980 318 H1005 M980 500 H1005" class="w-net-thin"/>
    <path d="M1005 160 H1028" class="w-net-thin" marker-end="url(#a-net)"/>
    <path d="M1005 310 H1028" class="w-net-thin" marker-end="url(#a-net)"/>
    <path d="M1005 442 H1028" class="w-net-thin" marker-end="url(#a-net)"/>
    <path d="M1005 542 H1028" class="w-net-thin" marker-end="url(#a-net)"/>
    <text x="1018" y="600" class="t-m" transform="rotate(90 1018 600)" style="fill: var(--warn)">HTTPS · keys from .env</text>
  </svg>
